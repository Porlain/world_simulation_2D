<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202827" />
    <title>示例城 · 流量制图台</title>
  </head>
  <body>
    <svg style="display:none" aria-hidden="true">
      <filter id="parchment-wavy">
        <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" seed="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="parchment-grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="5" result="grain" />
        <feColorMatrix type="matrix" values="0 0 0 0 0.38  0 0 0 0 0.32  0 0 0 0 0.24  0 0 0 0.08 0" in="grain" result="colored" />
        <feComposite operator="in" in="colored" in2="SourceGraphic" result="composite" />
        <feBlend mode="multiply" in="composite" in2="SourceGraphic" />
      </filter>
      <filter id="night-grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="3" result="grain" />
        <feColorMatrix type="matrix" values="0 0 0 0 0.04  0 0 0 0 0.06  0 0 0 0 0.10  0 0 0 0.06 0" in="grain" result="colored" />
        <feComposite operator="in" in="colored" in2="SourceGraphic" result="composite" />
        <feBlend mode="screen" in="composite" in2="SourceGraphic" />
      </filter>
    </svg>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
